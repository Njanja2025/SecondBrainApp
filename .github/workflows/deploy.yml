name: 🚀 Deploy GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write  # Required for GitHub Pages deployment

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 🧾 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 🧹 Clear pip cache
        run: |
          pip cache purge || true

      - name: ♻️ Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip

      - name: 📦 Install Dependencies
        run: |
          echo "Installing pip dependencies..."
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install --use-feature=2020-resolver -r requirements.txt || true
          else
            echo "❌ No requirements.txt found — skipping dependency install."
          fi

      - name: 🔍 Validate Environment
        run: |
          echo "🐍 Python version: $(python --version)"
          echo "📂 Working Directory: $PWD"
          echo "📁 Files:"
          ls -alh

      - name: 🏗 Build Static Site
        run: |
          echo "📁 Creating ./public directory..."
          mkdir -p public
          echo "<html><body><h1>✅ SecondBrainApp deployed successfully!</h1></body></html>" > public/index.html

      - name: 🔍 Verify Build Output
        run: |
          if [ ! -f public/index.html ]; then
            echo "❌ Static site generation failed!"
            exit 1
          else
            echo "✅ Static site build verified."
          fi

      - name: 🚀 Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GH_PAT }}
          publish_dir: ./public
          force_orphan: true
          cname: ${{ secrets.CUSTOM_DOMAIN || '' }}

      - name: ✅ Confirm Deployment Complete
        run: echo "🎉 GitHub Pages deployed successfully!"

